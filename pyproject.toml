[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deep-learning-wandb"
version = "0.0.13"
description = "Weights & Biases integration layer for dl-core."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "deep-learning-core>=0.0.26,<0.1",
    "wandb",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.12",
    "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/Blazkowiz47/dl-wandb"
Documentation = "https://github.com/Blazkowiz47/dl-wandb/tree/master/readme"
Repository = "https://github.com/Blazkowiz47/dl-wandb"
Issues = "https://github.com/Blazkowiz47/dl-wandb/issues"

[project.entry-points."dl_core.init_extensions"]
wandb = "dl_wandb.init_extension:WandbInitExtension"

[tool.hatch.build.targets.wheel]
packages = ["src/dl_wandb"]
